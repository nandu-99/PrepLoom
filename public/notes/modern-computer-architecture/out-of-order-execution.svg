<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Out-of-order execution with reorder buffer</title><desc id="desc">Instructions are fetched and decoded, renamed and allocated a reorder-buffer entry before entering the issue queue. Ready instructions execute, completion marks their existing ROB entries ready, and the oldest ready entries retire in program order.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#D8D6D1"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#F2F0EB}.h{font-size:38px;font-weight:700}.l{font-size:22px}.s{font-size:17px;fill:#A8AAAB}.box{fill:none;stroke:#D8D6D1;stroke-width:4}.line{fill:none;stroke:#D8D6D1;stroke-width:4;marker-end:url(#a)}.dash{fill:none;stroke:#777A7C;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#a)}</style></defs><rect width="1536" height="1024" fill="#25282B"/>
  <text x="75" y="85" class="h">OUT-OF-ORDER EXECUTION, IN-ORDER RETIREMENT</text>
  <rect x="70" y="225" width="190" height="130" rx="16" class="box"/><text x="165" y="285" text-anchor="middle" class="l">FETCH</text><text x="165" y="325" text-anchor="middle" class="s">program order</text><rect x="335" y="225" width="260" height="130" rx="16" class="box"/><text x="465" y="280" text-anchor="middle" class="l">DECODE + RENAME</text><text x="465" y="320" text-anchor="middle" class="s">allocate ROB entry</text><rect x="675" y="225" width="235" height="130" rx="16" class="box"/><text x="792" y="280" text-anchor="middle" class="l">ISSUE QUEUE</text><text x="792" y="320" text-anchor="middle" class="s">wait until ready</text><rect x="990" y="225" width="230" height="130" rx="16" class="box"/><text x="1105" y="280" text-anchor="middle" class="l">EXECUTE</text><text x="1105" y="320" text-anchor="middle" class="s">ready work first</text><path d="M260 290H335" class="line"/><path d="M595 290H675" class="line"/><path d="M910 290H990" class="line"/>
  <rect x="380" y="540" width="760" height="250" rx="20" class="box"/><text x="760" y="595" text-anchor="middle" class="l">REORDER BUFFER — ALLOCATED BEFORE EXECUTION</text><g class="s"><text x="450" y="655">Oldest</text><text x="1040" y="655">Youngest</text></g><g class="box"><rect x="460" y="685" width="140" height="60"/><rect x="600" y="685" width="140" height="60"/><rect x="740" y="685" width="140" height="60"/><rect x="880" y="685" width="140" height="60"/></g><g class="s"><text x="530" y="723" text-anchor="middle">I1 ready</text><text x="670" y="723" text-anchor="middle">I2 wait</text><text x="810" y="723" text-anchor="middle">I3 ready</text><text x="950" y="723" text-anchor="middle">I4 wait</text></g>
  <path d="M465 355V540" class="dash"/><text x="480" y="455" class="s">create entry</text><path d="M1105 355V470H870V540" class="line"/><text x="1000" y="450" class="s">completion marks ready</text><path d="M380 670H185V880H380" class="line"/><text x="90" y="820" class="l">RETIRE</text><text x="90" y="855" class="s">oldest ready first</text><text x="760" y="900" text-anchor="middle" class="s">Younger instructions may complete early, but cannot pass an older unresolved entry at retirement.</text>
</svg>
