<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Latch and flip-flop comparison</title><desc id="desc">A D latch follows D while enable is active. A D flip-flop samples D only at the active clock edge.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#D8D6D1"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#F2F0EB}.h{font-size:42px;font-weight:700}.l{font-size:28px}.s{font-size:21px;fill:#A8AAAB}.box{fill:none;stroke:#D8D6D1;stroke-width:4}.line{stroke:#D8D6D1;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1536" height="1024" fill="#25282B"/><text x="96" y="105" class="h">D LATCH AND D FLIP-FLOP</text>
  <text x="330" y="205" text-anchor="middle" class="l">LEVEL-SENSITIVE D LATCH</text><rect x="210" y="280" width="280" height="260" rx="18" class="box"/><text x="350" y="390" text-anchor="middle" class="h">D LATCH</text><text x="350" y="440" text-anchor="middle" class="s">Q follows D while EN = 1</text><path d="M80 350H210" class="line"/><text x="85" y="325" class="l">D</text><path d="M80 475H210" class="line"/><text x="85" y="450" class="l">EN</text><path d="M490 410H650" class="line"/><text x="575" y="382" class="l">Q</text>
  <text x="1110" y="205" text-anchor="middle" class="l">EDGE-TRIGGERED D FLIP-FLOP</text><rect x="970" y="280" width="280" height="260" rx="18" class="box"/><path d="M970 460l28 18-28 18" class="box"/><text x="1110" y="390" text-anchor="middle" class="h">D FF</text><text x="1110" y="440" text-anchor="middle" class="s">Q samples D at ↑ clock</text><path d="M820 350H970" class="line"/><text x="825" y="325" class="l">D</text><path d="M820 478H970" class="line"/><text x="825" y="450" class="l">CLK</text><path d="M1250 410H1410" class="line"/><text x="1335" y="382" class="l">Q</text>
  <rect x="155" y="690" width="1226" height="145" rx="18" class="box"/><text x="768" y="750" text-anchor="middle" class="l">Key difference</text><text x="768" y="798" text-anchor="middle" class="s">Latch: transparent during an active level   •   Flip-flop: updates only at an active edge</text>
</svg>
