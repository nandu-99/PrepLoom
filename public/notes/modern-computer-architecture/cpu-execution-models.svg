<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Single-cycle and multi-cycle execution</title><desc id="desc">In a nonpipelined single-cycle CPU each instruction occupies one long cycle and instructions do not overlap. In a nonpipelined multi-cycle CPU, each instruction uses several shorter stages and the next instruction begins after the previous instruction finishes.</desc>
  <defs><style>text{font-family:Inter,Arial,sans-serif;fill:#F2F0EB}.h{font-size:40px;font-weight:700}.l{font-size:23px}.s{font-size:18px;fill:#A8AAAB}.box{fill:none;stroke:#D8D6D1;stroke-width:3}.muted{fill:none;stroke:#777A7C;stroke-width:2}</style></defs><rect width="1536" height="1024" fill="#25282B"/>
  <text x="80" y="85" class="h">NONPIPELINED EXECUTION MODELS</text><text x="80" y="155" class="l">SINGLE-CYCLE • one long cycle per instruction</text>
  <g class="s"><text x="115" y="220">Instruction</text><text x="390" y="220">Long cycle 1</text><text x="765" y="220">Long cycle 2</text><text x="1140" y="220">Long cycle 3</text></g>
  <text x="110" y="300" class="l">I1</text><rect x="260" y="250" width="360" height="85" rx="12" class="box"/><text x="440" y="303" text-anchor="middle" class="s">IF + ID + EX + MEM + WB</text><text x="110" y="400" class="l">I2</text><rect x="635" y="350" width="360" height="85" rx="12" class="box"/><text x="815" y="403" text-anchor="middle" class="s">IF + ID + EX + MEM + WB</text><text x="110" y="500" class="l">I3</text><rect x="1010" y="450" width="360" height="85" rx="12" class="box"/><text x="1190" y="503" text-anchor="middle" class="s">IF + ID + EX + MEM + WB</text>
  <path d="M80 585H1455" class="muted"/><text x="80" y="655" class="l">MULTI-CYCLE • shorter cycles, variable instruction length, no overlap</text>
  <g class="s"><text x="285" y="720">C1</text><text x="430" y="720">C2</text><text x="575" y="720">C3</text><text x="720" y="720">C4</text><text x="865" y="720">C5</text><text x="1010" y="720">C6</text><text x="1155" y="720">C7</text><text x="1300" y="720">C8</text></g>
  <text x="110" y="790" class="l">Load I1</text><g class="box"><rect x="235" y="745" width="120" height="70"/><rect x="355" y="745" width="120" height="70"/><rect x="475" y="745" width="120" height="70"/><rect x="595" y="745" width="120" height="70"/><rect x="715" y="745" width="120" height="70"/></g><g class="s"><text x="295" y="789" text-anchor="middle">IF</text><text x="415" y="789" text-anchor="middle">ID</text><text x="535" y="789" text-anchor="middle">EX</text><text x="655" y="789" text-anchor="middle">MEM</text><text x="775" y="789" text-anchor="middle">WB</text></g>
  <text x="110" y="890" class="l">ALU I2</text><g class="box"><rect x="835" y="845" width="120" height="70"/><rect x="955" y="845" width="120" height="70"/><rect x="1075" y="845" width="120" height="70"/><rect x="1195" y="845" width="120" height="70"/></g><g class="s"><text x="895" y="889" text-anchor="middle">IF</text><text x="1015" y="889" text-anchor="middle">ID</text><text x="1135" y="889" text-anchor="middle">EX</text><text x="1255" y="889" text-anchor="middle">WB</text></g>
</svg>
