<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Hack computer platform</title>
  <desc id="desc">The CPU sends its PC address to instruction ROM, which returns an instruction. The CPU exchanges an address, output data, write control, and input data with separate data memory. Clock and reset enter the CPU.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#D8D6D1"/>
    </marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#F2F0EB}
      .h{font-size:42px;font-weight:700}
      .l{font-size:26px;font-weight:600}
      .s{font-size:19px;fill:#A8AAAB}
      .box{fill:none;stroke:#D8D6D1;stroke-width:4}
      .line{fill:none;stroke:#D8D6D1;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1536" height="1024" fill="#25282B"/>
  <text x="90" y="92" class="h">HACK COMPUTER: TWO MEMORY PATHS</text>

  <rect x="85" y="285" width="340" height="300" rx="20" class="box"/>
  <text x="255" y="405" text-anchor="middle" class="l">INSTRUCTION ROM</text>
  <text x="255" y="452" text-anchor="middle" class="l">ROM32K</text>
  <text x="255" y="505" text-anchor="middle" class="s">read-only instruction path</text>

  <rect x="600" y="285" width="340" height="300" rx="20" class="box"/>
  <text x="770" y="420" text-anchor="middle" class="h">CPU</text>
  <text x="770" y="470" text-anchor="middle" class="s">A, D, ALU, PC</text>

  <rect x="1110" y="285" width="340" height="300" rx="20" class="box"/>
  <text x="1280" y="380" text-anchor="middle" class="l">DATA MEMORY</text>
  <text x="1280" y="430" text-anchor="middle" class="s">RAM16K</text>
  <text x="1280" y="478" text-anchor="middle" class="s">screen map</text>
  <text x="1280" y="526" text-anchor="middle" class="s">keyboard map</text>

  <text x="512" y="332" text-anchor="middle" class="s">pc[14:0] address</text>
  <path d="M600 360H425" class="line"/>
  <text x="512" y="440" text-anchor="middle" class="s">instruction[15:0]</text>
  <path d="M425 470H600" class="line"/>

  <text x="1025" y="322" text-anchor="middle" class="s">addressM</text>
  <path d="M940 350H1110" class="line"/>
  <text x="1025" y="412" text-anchor="middle" class="s">outM + writeM</text>
  <path d="M940 440H1110" class="line"/>
  <text x="1025" y="502" text-anchor="middle" class="s">inM</text>
  <path d="M1110 530H940" class="line"/>

  <text x="690" y="160" text-anchor="middle" class="l">Clock</text>
  <path d="M690 185V285" class="line"/>
  <text x="850" y="160" text-anchor="middle" class="l">Reset</text>
  <path d="M850 185V285" class="line"/>

  <text x="90" y="820" class="l">Harvard-style organization</text>
  <text x="90" y="865" class="s">The PC addresses instruction ROM. The A register supplies the data-memory address.</text>
  <text x="90" y="900" class="s">Separate paths let instruction fetch and data access happen during the same cycle.</text>
</svg>
