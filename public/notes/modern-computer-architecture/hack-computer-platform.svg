<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Hack computer platform</title><desc id="desc">The CPU sends its PC address to instruction ROM, which returns an instruction. The CPU exchanges address, data and write control with data memory. Clock and reset enter the CPU.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#D8D6D1"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#F2F0EB}.h{font-size:42px;font-weight:700}.l{font-size:26px}.s{font-size:19px;fill:#A8AAAB}.box{fill:none;stroke:#D8D6D1;stroke-width:4}.line{fill:none;stroke:#D8D6D1;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="1536" height="1024" fill="#25282B"/><text x="92" y="95" class="h">HACK COMPUTER: TWO MEMORY PATHS</text>
  <rect x="600" y="300" width="340" height="330" rx="22" class="box"/><text x="770" y="445" text-anchor="middle" class="h">CPU</text><text x="770" y="495" text-anchor="middle" class="s">A • D • ALU • PC</text>
  <rect x="90" y="270" width="330" height="240" rx="20" class="box"/><text x="255" y="370" text-anchor="middle" class="l">INSTRUCTION ROM</text><text x="255" y="415" text-anchor="middle" class="l">ROM32K</text>
  <rect x="1110" y="230" width="330" height="460" rx="20" class="box"/><text x="1275" y="320" text-anchor="middle" class="l">DATA MEMORY</text><text x="1275" y="370" text-anchor="middle" class="s">RAM16K</text><text x="1275" y="430" text-anchor="middle" class="s">Screen map</text><text x="1275" y="490" text-anchor="middle" class="s">Keyboard map</text>
  <path d="M600 380H420" class="line"/><text x="505" y="350" text-anchor="middle" class="s">pc[14:0] address</text><path d="M420 455H600" class="line"/><text x="505" y="495" text-anchor="middle" class="s">instruction[15:0]</text>
  <path d="M940 350H1110" class="line"/><text x="1025" y="320" text-anchor="middle" class="s">addressM</text><path d="M940 440H1110" class="line"/><text x="1025" y="410" text-anchor="middle" class="s">outM + writeM</text><path d="M1110 555H940" class="line"/><text x="1025" y="600" text-anchor="middle" class="s">inM</text>
  <path d="M690 150V300" class="line"/><path d="M850 150V300" class="line"/><text x="690" y="125" text-anchor="middle" class="l">Clock</text><text x="850" y="125" text-anchor="middle" class="l">Reset</text>
  <text x="92" y="875" class="l">Harvard-style organization</text><text x="92" y="920" class="s">PC addresses instruction ROM. A register supplies the data-memory address.</text>
</svg>
