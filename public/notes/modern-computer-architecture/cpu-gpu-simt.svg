<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">CPU, GPU and a 32-thread CUDA warp</title><desc id="desc">A CPU is shown with a few complex cores, a GPU with many lanes, and a CUDA warp containing exactly 32 visible thread boxes in two rows of sixteen. Divergence masks lanes and consecutive addresses coalesce.</desc>
  <defs><style>text{font-family:Inter,Arial,sans-serif;fill:#F2F0EB}.h{font-size:38px;font-weight:700}.l{font-size:22px}.s{font-size:17px;fill:#A8AAAB}.box{fill:none;stroke:#D8D6D1;stroke-width:3}.muted{fill:none;stroke:#777A7C;stroke-width:2}</style></defs><rect width="1536" height="1024" fill="#25282B"/>
  <text x="70" y="80" class="h">CPU LATENCY • GPU THROUGHPUT • CUDA SIMT</text>
  <rect x="80" y="150" width="420" height="280" rx="20" class="box"/><text x="290" y="205" text-anchor="middle" class="l">CPU</text><rect x="145" y="245" width="120" height="100" rx="12" class="box"/><rect x="315" y="245" width="120" height="100" rx="12" class="box"/><text x="205" y="305" text-anchor="middle" class="s">Core 0</text><text x="375" y="305" text-anchor="middle" class="s">Core 1</text><text x="290" y="390" text-anchor="middle" class="s">few powerful cores • low latency</text>
  <rect x="570" y="150" width="880" height="280" rx="20" class="box"/><text x="1010" y="205" text-anchor="middle" class="l">GPU</text><g class="box"><rect x="640" y="250" width="75" height="75"/><rect x="735" y="250" width="75" height="75"/><rect x="830" y="250" width="75" height="75"/><rect x="925" y="250" width="75" height="75"/><rect x="1020" y="250" width="75" height="75"/><rect x="1115" y="250" width="75" height="75"/><rect x="1210" y="250" width="75" height="75"/><rect x="1305" y="250" width="75" height="75"/></g><text x="1010" y="390" text-anchor="middle" class="s">many execution lanes • high throughput</text>
  <text x="70" y="510" class="l">ONE NVIDIA CUDA WARP = EXACTLY 32 THREADS</text>
  <g class="box">
    <rect x="70" y="555" width="75" height="60"/><rect x="155" y="555" width="75" height="60"/><rect x="240" y="555" width="75" height="60"/><rect x="325" y="555" width="75" height="60"/><rect x="410" y="555" width="75" height="60"/><rect x="495" y="555" width="75" height="60"/><rect x="580" y="555" width="75" height="60"/><rect x="665" y="555" width="75" height="60"/><rect x="750" y="555" width="75" height="60"/><rect x="835" y="555" width="75" height="60"/><rect x="920" y="555" width="75" height="60"/><rect x="1005" y="555" width="75" height="60"/><rect x="1090" y="555" width="75" height="60"/><rect x="1175" y="555" width="75" height="60"/><rect x="1260" y="555" width="75" height="60"/><rect x="1345" y="555" width="75" height="60"/>
    <rect x="70" y="630" width="75" height="60"/><rect x="155" y="630" width="75" height="60"/><rect x="240" y="630" width="75" height="60"/><rect x="325" y="630" width="75" height="60"/><rect x="410" y="630" width="75" height="60"/><rect x="495" y="630" width="75" height="60"/><rect x="580" y="630" width="75" height="60"/><rect x="665" y="630" width="75" height="60"/><rect x="750" y="630" width="75" height="60"/><rect x="835" y="630" width="75" height="60"/><rect x="920" y="630" width="75" height="60"/><rect x="1005" y="630" width="75" height="60"/><rect x="1090" y="630" width="75" height="60"/><rect x="1175" y="630" width="75" height="60"/><rect x="1260" y="630" width="75" height="60"/><rect x="1345" y="630" width="75" height="60"/>
  </g>
  <g class="s"><text x="108" y="593" text-anchor="middle">0</text><text x="193" y="593" text-anchor="middle">1</text><text x="278" y="593" text-anchor="middle">2</text><text x="363" y="593" text-anchor="middle">3</text><text x="1408" y="593" text-anchor="middle">15</text><text x="108" y="668" text-anchor="middle">16</text><text x="193" y="668" text-anchor="middle">17</text><text x="278" y="668" text-anchor="middle">18</text><text x="363" y="668" text-anchor="middle">19</text><text x="1408" y="668" text-anchor="middle">31</text></g>
  <rect x="70" y="770" width="650" height="145" rx="18" class="box"/><text x="395" y="825" text-anchor="middle" class="l">DIVERGENCE</text><text x="395" y="870" text-anchor="middle" class="s">different paths → inactive lanes are masked</text><rect x="800" y="770" width="650" height="145" rx="18" class="box"/><text x="1125" y="825" text-anchor="middle" class="l">COALESCING</text><text x="1125" y="870" text-anchor="middle" class="s">nearby threads + nearby addresses → fewer transactions</text>
</svg>
