<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Hack CPU datapath</title><desc id="desc">The D register feeds ALU x. A register output or memory input feeds ALU y. The ALU result can load A or D and drives outM. A supplies addressM. Jump logic loads the PC from A based on instruction bits and ALU flags.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#D8D6D1"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#F2F0EB}.h{font-size:38px;font-weight:700}.l{font-size:23px}.s{font-size:18px;fill:#A8AAAB}.box{fill:none;stroke:#D8D6D1;stroke-width:4}.line{fill:none;stroke:#D8D6D1;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="1536" height="1024" fill="#25282B"/><text x="75" y="80" class="h">HACK CPU DATAPATH: CORRECT SIGNAL DIRECTION</text>
  <rect x="135" y="230" width="240" height="170" rx="16" class="box"/><text x="255" y="300" text-anchor="middle" class="l">A INPUT MUX</text><text x="255" y="345" text-anchor="middle" class="s">instruction value / ALU out</text><rect x="455" y="230" width="190" height="170" rx="16" class="box"/><text x="550" y="330" text-anchor="middle" class="h">A REG</text>
  <rect x="455" y="565" width="190" height="170" rx="16" class="box"/><text x="550" y="665" text-anchor="middle" class="h">D REG</text><rect x="750" y="315" width="230" height="150" rx="16" class="box"/><text x="865" y="405" text-anchor="middle" class="l">A / inM MUX</text><rect x="1080" y="390" width="260" height="210" rx="20" class="box"/><text x="1210" y="490" text-anchor="middle" class="h">ALU</text><text x="1210" y="535" text-anchor="middle" class="s">zx nx zy ny f no</text>
  <path d="M55 270H135" class="line"/><text x="55" y="240" class="s">instruction[14:0]</text><path d="M375 315H455" class="line"/><path d="M645 315H750" class="line"/><text x="675" y="285" class="s">A out</text><path d="M690 430H750" class="line"/><text x="655" y="465" class="s">inM</text><path d="M980 390H1080" class="line"/><text x="1015" y="365" class="s">y</text><path d="M645 650H1030V550H1080" class="line"/><text x="825" y="680" class="s">D out → x</text>
  <path d="M1340 495H1450" class="line"/><text x="1370" y="465" class="s">outM</text><path d="M1390 495V835H550V735" class="line"/><text x="1010" y="870" class="s">ALU result can load D</text><path d="M1390 495V165H255V230" class="line"/><text x="850" y="145" text-anchor="middle" class="s">ALU result can load A for dest A</text>
  <path d="M645 315H700V245H1450" class="line"/><text x="1240" y="225" class="s">addressM = A[14:0]</text>
  <rect x="730" y="730" width="270" height="130" rx="16" class="box"/><text x="865" y="785" text-anchor="middle" class="l">JUMP LOGIC</text><text x="865" y="825" text-anchor="middle" class="s">j bits + zr/ng → loadPC</text><rect x="1120" y="700" width="220" height="170" rx="16" class="box"/><text x="1230" y="785" text-anchor="middle" class="h">PC</text><text x="1230" y="825" text-anchor="middle" class="s">load A; else PC+1</text><path d="M1000 795H1120" class="line"/><text x="1035" y="775" class="s">load</text><path d="M690 315V675H1080V735H1120" class="line"/><text x="860" y="705" class="s">jump target = A</text><path d="M1340 785H1460" class="line"/><text x="1390" y="755" class="s">pc</text><path d="M1230 930V870" class="line"/><text x="1230" y="965" text-anchor="middle" class="s">reset</text>
  <text x="75" y="960" class="s">Clocked: A, D, PC. Combinational during the cycle: ALU, outM, writeM, zr, ng.</text>
</svg>
