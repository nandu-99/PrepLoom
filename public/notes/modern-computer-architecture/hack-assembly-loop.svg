<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Complete Hack countdown loop</title><desc id="desc">The program initializes count to three, enters a LOOP label, exits when count is zero, decrements count, jumps back, and then stops at END.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#D8D6D1"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#F2F0EB}.h{font-size:40px;font-weight:700}.code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:24px}.s{font-size:20px;fill:#A8AAAB}.box{fill:none;stroke:#D8D6D1;stroke-width:4}.line{fill:none;stroke:#D8D6D1;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="1536" height="1024" fill="#25282B"/><text x="85" y="90" class="h">COMPLETE HACK COUNTDOWN LOOP</text>
  <rect x="95" y="150" width="650" height="770" rx="20" class="box"/>
  <text x="145" y="210" class="code"><tspan x="145" dy="0">@3</tspan><tspan x="145" dy="36">D=A</tspan><tspan x="145" dy="36">@count</tspan><tspan x="145" dy="36">M=D        // count = 3</tspan><tspan x="145" dy="54">(LOOP)</tspan><tspan x="145" dy="36">@count</tspan><tspan x="145" dy="36">D=M</tspan><tspan x="145" dy="36">@END</tspan><tspan x="145" dy="36">D;JEQ      // exit if zero</tspan><tspan x="145" dy="54">@count</tspan><tspan x="145" dy="36">M=M-1      // make progress</tspan><tspan x="145" dy="36">@LOOP</tspan><tspan x="145" dy="36">0;JMP</tspan><tspan x="145" dy="54">(END)</tspan><tspan x="145" dy="36">@END</tspan><tspan x="145" dy="36">0;JMP</tspan></text>
  <rect x="890" y="205" width="500" height="155" rx="18" class="box"/><text x="1140" y="265" text-anchor="middle" class="s">1. INITIALIZE</text><text x="1140" y="315" text-anchor="middle" class="code">count ← 3</text>
  <rect x="890" y="430" width="500" height="155" rx="18" class="box"/><text x="1140" y="490" text-anchor="middle" class="s">2. TEST AND UPDATE</text><text x="1140" y="540" text-anchor="middle" class="code">if count = 0 exit; else count--</text>
  <rect x="890" y="655" width="500" height="155" rx="18" class="box"/><text x="1140" y="715" text-anchor="middle" class="s">3. REPEAT</text><text x="1140" y="765" text-anchor="middle" class="code">jump to LOOP</text>
  <path d="M745 275H890" class="line"/><path d="M745 505H890" class="line"/><path d="M745 735H890" class="line"/>
</svg>
