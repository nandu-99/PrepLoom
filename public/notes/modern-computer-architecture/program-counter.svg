<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Program counter control</title><desc id="desc">A priority selector chooses reset zero, load target, incremented current PC, or held current PC. The PC register stores the selected value at the clock edge and outputs the current instruction address.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#D8D6D1"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#F2F0EB}.h{font-size:42px;font-weight:700}.l{font-size:25px}.s{font-size:20px;fill:#A8AAAB}.box{fill:none;stroke:#D8D6D1;stroke-width:4}.line{fill:none;stroke:#D8D6D1;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="1536" height="1024" fill="#25282B"/><text x="95" y="100" class="h">PROGRAM COUNTER: CHOOSE, THEN STORE</text>
  <rect x="250" y="225" width="360" height="510" rx="20" class="box"/><text x="430" y="290" text-anchor="middle" class="l">PRIORITY SELECTOR</text><text x="430" y="350" text-anchor="middle" class="l">1. Reset → 0</text><text x="430" y="405" text-anchor="middle" class="l">2. Load → target</text><text x="430" y="460" text-anchor="middle" class="l">3. Increment → PC + step</text><text x="430" y="515" text-anchor="middle" class="l">4. Otherwise → hold</text>
  <rect x="790" y="340" width="310" height="250" rx="20" class="box"/><text x="945" y="440" text-anchor="middle" class="h">PC REGISTER</text><text x="945" y="490" text-anchor="middle" class="s">stores at clock edge</text>
  <path d="M70 330H250" class="line"/><text x="75" y="300" class="l">Reset / Load / Inc</text><path d="M70 610H250" class="line"/><text x="75" y="580" class="l">Load target</text><path d="M610 465H790" class="line"/><text x="640" y="435" class="s">selected next PC</text><path d="M945 235V340" class="line"/><text x="945" y="205" text-anchor="middle" class="l">Clock</text>
  <path d="M1100 465H1410" class="line"/><text x="1255" y="425" text-anchor="middle" class="l">Current PC output</text><text x="1255" y="540" text-anchor="middle" class="s">instruction-memory address</text>
  <path d="M1225 465V790H430V735" class="line"/><text x="800" y="835" text-anchor="middle" class="s">feedback supplies hold value and PC + instruction step</text>
</svg>
