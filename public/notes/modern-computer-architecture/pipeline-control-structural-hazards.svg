<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Control and structural pipeline hazards</title><desc id="desc">A branch resolves in EX and flushes two younger wrong-path instructions. A separate diagram shows instruction fetch and a load memory stage requesting one single-port memory in the same cycle.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#D8D6D1"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#F2F0EB}.h{font-size:38px;font-weight:700}.l{font-size:22px}.s{font-size:17px;fill:#A8AAAB}.box{fill:none;stroke:#D8D6D1;stroke-width:3}.dash{fill:none;stroke:#777A7C;stroke-width:3;stroke-dasharray:10 8}.line{fill:none;stroke:#D8D6D1;stroke-width:4;marker-end:url(#a)}</style></defs><rect width="1536" height="1024" fill="#25282B"/>
  <text x="70" y="78" class="h">CONTROL HAZARD: FLUSH YOUNGER WRONG-PATH WORK</text><g class="s"><text x="330" y="145">C1</text><text x="465" y="145">C2</text><text x="600" y="145">C3</text><text x="735" y="145">C4</text><text x="870" y="145">C5</text><text x="1005" y="145">C6</text></g>
  <text x="70" y="225" class="l">Branch</text><g class="box"><rect x="270" y="175" width="120" height="70"/><rect x="390" y="175" width="120" height="70"/><rect x="510" y="175" width="120" height="70"/><rect x="630" y="175" width="120" height="70"/><rect x="750" y="175" width="120" height="70"/></g><text x="70" y="325" class="l">Wrong I2</text><g class="box"><rect x="390" y="275" width="120" height="70"/><rect x="510" y="275" width="120" height="70"/><rect x="630" y="275" width="120" height="70" class="dash"/></g><text x="70" y="425" class="l">Wrong I3</text><g class="box"><rect x="510" y="375" width="120" height="70"/><rect x="630" y="375" width="120" height="70" class="dash"/></g><text x="70" y="525" class="l">Target I</text><g class="box"><rect x="630" y="475" width="120" height="70"/><rect x="750" y="475" width="120" height="70"/><rect x="870" y="475" width="120" height="70"/><rect x="990" y="475" width="120" height="70"/><rect x="1110" y="475" width="120" height="70"/></g>
  <g class="s"><text x="330" y="220" text-anchor="middle">IF</text><text x="450" y="220" text-anchor="middle">ID</text><text x="570" y="220" text-anchor="middle">EX: resolve</text><text x="690" y="220" text-anchor="middle">MEM</text><text x="810" y="220" text-anchor="middle">WB</text><text x="450" y="320" text-anchor="middle">IF</text><text x="570" y="320" text-anchor="middle">ID</text><text x="690" y="320" text-anchor="middle">FLUSH</text><text x="570" y="420" text-anchor="middle">IF</text><text x="690" y="420" text-anchor="middle">FLUSH</text><text x="690" y="520" text-anchor="middle">IF</text><text x="810" y="520" text-anchor="middle">ID</text><text x="930" y="520" text-anchor="middle">EX</text><text x="1050" y="520" text-anchor="middle">MEM</text><text x="1170" y="520" text-anchor="middle">WB</text></g>
  <path d="M70 605H1460" class="dash"/><text x="70" y="675" class="h">STRUCTURAL HAZARD: ONE MEMORY, TWO REQUESTS</text><rect x="620" y="745" width="310" height="145" rx="18" class="box"/><text x="775" y="805" text-anchor="middle" class="l">SINGLE-PORT MEMORY</text><text x="775" y="848" text-anchor="middle" class="s">only one access this cycle</text><rect x="105" y="740" width="280" height="115" rx="18" class="box"/><text x="245" y="808" text-anchor="middle" class="l">IF: fetch instruction</text><rect x="1150" y="740" width="280" height="115" rx="18" class="box"/><text x="1290" y="808" text-anchor="middle" class="l">MEM: load data</text><path d="M385 798H620" class="line"/><path d="M1150 798H930" class="line"/><text x="775" y="955" text-anchor="middle" class="s">Fix: separate instruction/data memories or stall one request.</text>
</svg>
