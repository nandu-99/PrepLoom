<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Build 4K by 8 memory from four 1K by 8 chips</title><desc id="desc">High address bits A11 and A10 enter a two-to-four decoder. Each decoder output selects one chip. Low address bits A9 through A0 and the eight-bit data bus connect to all four chips.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#D8D6D1"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#F2F0EB}.h{font-size:40px;font-weight:700}.l{font-size:25px}.s{font-size:19px;fill:#A8AAAB}.box{fill:none;stroke:#D8D6D1;stroke-width:4}.line{fill:none;stroke:#D8D6D1;stroke-width:4}.arrow{fill:none;stroke:#D8D6D1;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="1536" height="1024" fill="#25282B"/><text x="90" y="90" class="h">4K × 8 FROM FOUR 1K × 8 CHIPS</text>
  <rect x="155" y="220" width="270" height="190" rx="16" class="box"/><text x="290" y="292" text-anchor="middle" class="l">2-TO-4 DECODER</text><text x="290" y="335" text-anchor="middle" class="s">bank select</text><path d="M65 315H155" class="arrow"/><text x="65" y="282" class="l">A11..A10</text>
  <g><rect x="650" y="155" width="420" height="145" rx="14" class="box"/><rect x="650" y="340" width="420" height="145" rx="14" class="box"/><rect x="650" y="525" width="420" height="145" rx="14" class="box"/><rect x="650" y="710" width="420" height="145" rx="14" class="box"/><text x="860" y="215" text-anchor="middle" class="l">CHIP 0 • 1K × 8</text><text x="860" y="400" text-anchor="middle" class="l">CHIP 1 • 1K × 8</text><text x="860" y="585" text-anchor="middle" class="l">CHIP 2 • 1K × 8</text><text x="860" y="770" text-anchor="middle" class="l">CHIP 3 • 1K × 8</text></g>
  <path d="M425 255L650 227" class="arrow"/><path d="M425 300L650 412" class="arrow"/><path d="M425 345L650 597" class="arrow"/><path d="M425 390L650 782" class="arrow"/><text x="470" y="220" class="s">independent CS0..CS3</text>
  <path d="M1180 105V900" class="line"/><path d="M1180 227H1070M1180 412H1070M1180 597H1070M1180 782H1070" class="line"/><text x="1160" y="105" text-anchor="end" class="l">A9..A0</text><text x="1160" y="138" text-anchor="end" class="s">all chip address inputs</text>
  <path d="M1320 105V900" class="line"/><path d="M1320 260H1070M1320 445H1070M1320 630H1070M1320 815H1070" class="line"/><text x="1340" y="105" class="l">D7..D0</text><text x="1340" y="138" class="s">shared data bus</text>
  <text x="90" y="950" class="s">A11..A10 choose one bank. A9..A0 choose one of 1024 words inside that selected bank.</text>
</svg>
