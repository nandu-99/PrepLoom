<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Polling versus interrupts</title><desc id="desc">Polling repeatedly checks device status. With interrupts, the main program runs until the device asynchronously requests service, then the CPU saves state, runs the ISR, restores state and resumes.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#D8D6D1"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#F2F0EB}.h{font-size:40px;font-weight:700}.l{font-size:25px}.s{font-size:19px;fill:#A8AAAB}.box{fill:none;stroke:#D8D6D1;stroke-width:4}.line{fill:none;stroke:#D8D6D1;stroke-width:4;marker-end:url(#a)}.dash{stroke-dasharray:14 10}</style></defs>
  <rect width="1536" height="1024" fill="#25282B"/><text x="90" y="90" class="h">POLLING VS INTERRUPT-DRIVEN I/O</text>
  <text x="360" y="170" text-anchor="middle" class="l">POLLING: CPU KEEPS ASKING</text><rect x="140" y="240" width="440" height="130" rx="18" class="box"/><text x="360" y="320" text-anchor="middle" class="l">Read device status</text><rect x="140" y="475" width="440" height="130" rx="18" class="box"/><text x="360" y="555" text-anchor="middle" class="l">Ready? Service device</text><path d="M360 370V475" class="line"/><path d="M140 540H80V305H140" class="line"/><text x="105" y="430" text-anchor="middle" class="s" transform="rotate(-90 105 430)">not ready: repeat</text>
  <text x="1135" y="170" text-anchor="middle" class="l">INTERRUPT: DEVICE REQUESTS SERVICE</text><rect x="870" y="230" width="350" height="120" rx="18" class="box"/><text x="1045" y="302" text-anchor="middle" class="l">Main program runs</text><rect x="870" y="500" width="350" height="135" rx="18" class="box"/><text x="1045" y="555" text-anchor="middle" class="l">Save state → ISR</text><text x="1045" y="595" text-anchor="middle" class="s">service and acknowledge</text><rect x="1280" y="355" width="190" height="115" rx="18" class="box"/><text x="1375" y="425" text-anchor="middle" class="l">Device</text>
  <path d="M1280 412H1045V500" class="line dash"/><text x="1180" y="390" class="s">asynchronous IRQ</text><path d="M1045 635V790H780V290H870" class="line"/><text x="825" y="755" class="s">restore and resume same program</text>
  <text x="90" y="930" class="s">Polling spends CPU time checking. Interrupts add handler overhead but let useful work continue between device events.</text>
</svg>
