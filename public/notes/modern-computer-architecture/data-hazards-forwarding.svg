<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Forwarding and load-use stall</title><desc id="desc">Two staggered pipeline examples. An ADD result is forwarded after its EX stage to the dependent SUB EX stage. A load followed by a dependent ADD inserts one bubble because data is ready only after MEM.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#D8D6D1"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#F2F0EB}.h{font-size:38px;font-weight:700}.l{font-size:22px}.s{font-size:17px;fill:#A8AAAB}.box{fill:none;stroke:#D8D6D1;stroke-width:3}.line{fill:none;stroke:#D8D6D1;stroke-width:4;marker-end:url(#a)}.stall{fill:none;stroke:#777A7C;stroke-width:3;stroke-dasharray:10 8}</style></defs><rect width="1536" height="1024" fill="#25282B"/>
  <text x="70" y="80" class="h">RAW HAZARDS: FORWARD WHEN READY, STALL WHEN NOT</text><text x="70" y="145" class="l">ALU dependency: ADD R1,... → SUB ...,R1</text>
  <g class="s"><text x="300" y="205">C1</text><text x="445" y="205">C2</text><text x="590" y="205">C3</text><text x="735" y="205">C4</text><text x="880" y="205">C5</text><text x="1025" y="205">C6</text></g>
  <text x="75" y="285" class="l">ADD</text><g class="box"><rect x="240" y="235" width="130" height="75"/><rect x="370" y="235" width="130" height="75"/><rect x="500" y="235" width="130" height="75"/><rect x="630" y="235" width="130" height="75"/><rect x="760" y="235" width="130" height="75"/></g><text x="75" y="390" class="l">SUB</text><g class="box"><rect x="370" y="340" width="130" height="75"/><rect x="500" y="340" width="130" height="75"/><rect x="630" y="340" width="130" height="75"/><rect x="760" y="340" width="130" height="75"/><rect x="890" y="340" width="130" height="75"/></g><g class="s"><text x="305" y="282" text-anchor="middle">IF</text><text x="435" y="282" text-anchor="middle">ID</text><text x="565" y="282" text-anchor="middle">EX</text><text x="695" y="282" text-anchor="middle">MEM</text><text x="825" y="282" text-anchor="middle">WB</text><text x="435" y="387" text-anchor="middle">IF</text><text x="565" y="387" text-anchor="middle">ID</text><text x="695" y="387" text-anchor="middle">EX</text><text x="825" y="387" text-anchor="middle">MEM</text><text x="955" y="387" text-anchor="middle">WB</text></g><path d="M565 310V325H695V340" class="line"/><text x="790" y="325" class="s">EX/MEM → next EX</text>
  <path d="M70 500H1460" class="stall"/><text x="70" y="570" class="l">Load-use dependency: LW R1,... → ADD ...,R1</text>
  <text x="75" y="690" class="l">LW</text><g class="box"><rect x="240" y="640" width="130" height="75"/><rect x="370" y="640" width="130" height="75"/><rect x="500" y="640" width="130" height="75"/><rect x="630" y="640" width="130" height="75"/><rect x="760" y="640" width="130" height="75"/></g><text x="75" y="800" class="l">ADD</text><g class="box"><rect x="370" y="750" width="130" height="75"/><rect x="500" y="750" width="130" height="75"/><rect x="630" y="750" width="130" height="75" class="stall"/><rect x="760" y="750" width="130" height="75"/><rect x="890" y="750" width="130" height="75"/><rect x="1020" y="750" width="130" height="75"/></g><g class="s"><text x="305" y="687" text-anchor="middle">IF</text><text x="435" y="687" text-anchor="middle">ID</text><text x="565" y="687" text-anchor="middle">EX</text><text x="695" y="687" text-anchor="middle">MEM</text><text x="825" y="687" text-anchor="middle">WB</text><text x="435" y="797" text-anchor="middle">IF</text><text x="565" y="797" text-anchor="middle">ID</text><text x="695" y="797" text-anchor="middle">BUBBLE</text><text x="825" y="797" text-anchor="middle">EX</text><text x="955" y="797" text-anchor="middle">MEM</text><text x="1085" y="797" text-anchor="middle">WB</text></g><path d="M695 715V735H825V750" class="line"/><text x="910" y="720" class="s">load data after MEM; one stall</text>
</svg>
