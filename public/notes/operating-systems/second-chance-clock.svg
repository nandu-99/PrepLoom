<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Second Chance Clock algorithm</title>
  <desc id="desc">The clock hand scans frames. A reference bit of one is cleared and skipped. A reference bit of zero selects the victim.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#D8D6D1"/></marker><style>.title{font:600 44px Inter,Arial,sans-serif;fill:#F2F0EB}.label{font:600 28px Inter,Arial,sans-serif;fill:#F2F0EB}.small{font:500 22px Inter,Arial,sans-serif;fill:#A8AAAB}.box{fill:#25282B;stroke:#D8D6D1;stroke-width:3}.line{fill:none;stroke:#D8D6D1;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1536" height="1024" fill="#25282B"/>
  <text x="768" y="108" text-anchor="middle" class="title">SECOND CHANCE (CLOCK)</text>
  <circle cx="720" cy="532" r="292" fill="none" stroke="#777A7C" stroke-width="3"/>
  <rect x="626" y="198" width="188" height="86" rx="16" class="box"/><text x="720" y="251" text-anchor="middle" class="label">A · R = 1</text>
  <rect x="925" y="338" width="188" height="86" rx="16" class="box"/><text x="1019" y="391" text-anchor="middle" class="label">B · R = 0</text>
  <rect x="862" y="694" width="188" height="86" rx="16" class="box"/><text x="956" y="747" text-anchor="middle" class="label">C · R = 1</text>
  <rect x="390" y="694" width="188" height="86" rx="16" class="box"/><text x="484" y="747" text-anchor="middle" class="label">D · R = 0</text>
  <rect x="327" y="338" width="188" height="86" rx="16" class="box"/><text x="421" y="391" text-anchor="middle" class="label">E · R = 1</text>
  <circle cx="720" cy="532" r="22" fill="#25282B" stroke="#D8D6D1" stroke-width="3"/><path d="M720 510V310" class="line"/><text x="748" y="421" class="small">CLOCK HAND</text>
  <path d="M1088 675c78-92 83-210 18-302" class="line"/><text x="1130" y="540" class="small">CLOCKWISE</text>
  <rect x="1180" y="338" width="278" height="100" rx="16" class="box"/><text x="1319" y="380" text-anchor="middle" class="label"><tspan x="1319">R = 1</tspan><tspan x="1319" dy="34" class="small">SET TO 0, SKIP</tspan></text>
  <rect x="1180" y="488" width="278" height="100" rx="16" class="box"/><text x="1319" y="530" text-anchor="middle" class="label"><tspan x="1319">R = 0</tspan><tspan x="1319" dy="34" class="small">REPLACE</tspan></text>
</svg>
