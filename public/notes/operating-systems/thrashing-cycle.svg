<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Thrashing cycle</title><desc id="desc">Too few frames cause more page faults, more storage input output, less useful CPU work, and slower processes.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#D8D6D1"/></marker><style>.title{font:600 50px Inter,Arial,sans-serif;fill:#F2F0EB}.label{font:600 24px Inter,Arial,sans-serif;fill:#F2F0EB}.small{font:500 22px Inter,Arial,sans-serif;fill:#A8AAAB}.box{fill:#25282B;stroke:#D8D6D1;stroke-width:3}.line{fill:none;stroke:#D8D6D1;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1536" height="1024" fill="#25282B"/>
  <text x="768" y="500" text-anchor="middle" class="title">THRASHING</text>
  <rect x="625" y="128" width="286" height="96" rx="18" class="box"/><text x="768" y="185" text-anchor="middle" class="label">TOO FEW FRAMES</text>
  <rect x="1055" y="330" width="310" height="96" rx="18" class="box"/><text x="1210" y="387" text-anchor="middle" class="label">MORE PAGE FAULTS</text>
  <rect x="960" y="706" width="330" height="96" rx="18" class="box"/><text x="1125" y="763" text-anchor="middle" class="label">MORE STORAGE I/O</text>
  <rect x="246" y="706" width="360" height="96" rx="18" class="box"/><text x="426" y="763" text-anchor="middle" class="label">LESS USEFUL CPU WORK</text>
  <rect x="171" y="330" width="310" height="96" rx="18" class="box"/><text x="326" y="387" text-anchor="middle" class="label">SLOWER PROCESSES</text>
  <path d="M911 176c132 22 228 74 284 140" class="line"/><path d="M1262 426c35 88 8 184-79 266" class="line"/><path d="M960 754H620" class="line"/><path d="M350 706c-57-76-72-166-40-266" class="line"/><path d="M390 330c62-75 139-127 221-145" class="line"/>
  <text x="768" y="914" text-anchor="middle" class="small">MORE TIME MOVING PAGES · LESS TIME RUNNING CODE</text>
</svg>
