<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Page replacement flow</title>
  <desc id="desc">A page fault with no free frame leads to victim selection, optional dirty page write-back, loading the required page, updating the page table, and restarting the instruction.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#D8D6D1"/>
    </marker>
    <style>
      .title{font:600 44px Inter,Arial,sans-serif;fill:#F2F0EB;letter-spacing:-1px}.label{font:600 25px Inter,Arial,sans-serif;fill:#F2F0EB}.small{font:500 20px Inter,Arial,sans-serif;fill:#A8AAAB}.box{fill:#25282B;stroke:#D8D6D1;stroke-width:3}.line{fill:none;stroke:#D8D6D1;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1536" height="1024" fill="#25282B"/>
  <text x="768" y="112" text-anchor="middle" class="title">PAGE REPLACEMENT FLOW</text>
  <rect x="96" y="330" width="210" height="104" rx="18" class="box"/><text x="201" y="391" text-anchor="middle" class="label">PAGE FAULT</text>
  <path d="M306 382h82" class="line"/>
  <rect x="402" y="330" width="230" height="104" rx="18" class="box"/><text x="517" y="374" text-anchor="middle" class="label"><tspan x="517">NO FREE</tspan><tspan x="517" dy="31">FRAME</tspan></text>
  <path d="M632 382h82" class="line"/>
  <rect x="728" y="330" width="250" height="104" rx="18" class="box"/><text x="853" y="374" text-anchor="middle" class="label"><tspan x="853">SELECT VICTIM</tspan><tspan x="853" dy="31">PAGE</tspan></text>
  <path d="M978 382h72" class="line"/>
  <path d="M1120 312l82 70-82 70-82-70z" class="box"/><text x="1120" y="390" text-anchor="middle" class="label">DIRTY?</text>
  <path d="M1202 382h88" class="line"/><text x="1240" y="356" text-anchor="middle" class="small">NO</text>
  <path d="M1120 452v140h170" class="line"/><text x="1148" y="522" class="small">YES</text>
  <rect x="1304" y="330" width="168" height="104" rx="18" class="box"/><text x="1388" y="374" text-anchor="middle" class="label"><tspan x="1388">LOAD</tspan><tspan x="1388" dy="31">PAGE</tspan></text>
  <rect x="1304" y="540" width="168" height="104" rx="18" class="box"/><text x="1388" y="584" text-anchor="middle" class="label"><tspan x="1388">WRITE</tspan><tspan x="1388" dy="31">BACK</tspan></text>
  <path d="M1388 540v-92" class="line"/>
  <path d="M1388 434v160c0 82-68 148-150 148H888" class="line"/>
  <rect x="624" y="690" width="250" height="104" rx="18" class="box"/><text x="749" y="734" text-anchor="middle" class="label"><tspan x="749">UPDATE</tspan><tspan x="749" dy="31">PAGE TABLE</tspan></text>
  <path d="M624 742h-88" class="line"/>
  <rect x="272" y="690" width="250" height="104" rx="18" class="box"/><text x="397" y="734" text-anchor="middle" class="label"><tspan x="397">RESTART</tspan><tspan x="397" dy="31">INSTRUCTION</tspan></text>
</svg>
